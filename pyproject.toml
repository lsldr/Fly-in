[project]
name = "fly-in"
version = "0.1.0"
description = "A graph traversal-related project with drone flight simulation."
readme = "README.md"
authors = [
    { name = "Aman", email = "asuleime@student.42warsaw.pl" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "PySide6>=6.8",
]

[project.scripts]
fly-in = "fly_in.cli:main"
fly-in-gui = "fly_in.gui:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.4.0",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.flake8]
max-line-length = 79
exclude = [".venv", "__pycache__"]